services:
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: quickdrop
      POSTGRES_USER: quickdrop_user
      POSTGRES_PASSWORD: quickdrop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdrop_user -d quickdrop"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PAYSWIFT_BASE_URL=http://payswift:8081
      - DATABASE_URL=postgresql://quickdrop_user:quickdrop_password@postgres:5432/quickdrop
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      payswift:
        condition: service_started

volumes:
  postgres_data:
